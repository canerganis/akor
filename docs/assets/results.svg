  <text class="ink sans fade" x="398.3" y="324" font-size="18" font-weight="700" style="animation-delay:1.95s">86.9</text>
  <g class="badge" style="animation-delay:2.15s"><rect class="accent" x="462.3" y="305" width="82" height="24" rx="12"/><text class="sans" x="503.3" y="322" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">-40.6%</text></g>
  <text class="ink2 sans" x="588" y="289" font-size="15" font-weight="400">Plain JSON</text>
