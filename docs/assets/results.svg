  <text class="ink sans fade" x="487.4" y="290" font-size="18" font-weight="700" style="animation-delay:1.80s">146.3</text>
  <text class="ink sans" x="170" y="323" font-size="15" font-weight="700">AKOR</text>
  <rect class="track" x="258" y="304" width="220" height="26" rx="6"/>
