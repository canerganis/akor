  <path class="rule" d="M24 250 H 936"/>
  <text class="ink sans" x="24" y="310" font-size="21" font-weight="800">Fable 5.1</text>
  <text class="ink2 sans" x="170" y="289" font-size="15" font-weight="400">Plain JSON</text>
