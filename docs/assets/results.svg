<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Fewer total tokens than AKOR 0.8 for the same verified work</title>
  <desc id="d">Live measurements with claude -p; every job checked by deterministic oracles. 64 uniform jobs per call: Opus 5.5 47 percent fewer tokens, Sonnet 5.5 47, Fable 5.1 45, Haiku 5.5 33. 32 uniform jobs: Opus 38, Sonnet 35, Fable 35, Haiku 32. 64 mixed jobs: Sonnet 28, Haiku 11.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e7e6e1; stroke-width: 1; }
    .axis { stroke: #c9c8c2; stroke-width: 1; }
    .bar { fill: #2a78d6; }
    .target { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .val { paint-order: stroke; stroke: #fcfcfb; stroke-width: 5px; stroke-linejoin: round; }
    text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .grow { animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .muted { fill: #9a998f; }
      .grid { stroke: #2e2e2c; }
      .axis { stroke: #45453f; }
      .bar { fill: #3987e5; }
      .target { stroke: #c3c2b7; }
      .val { stroke: #1a1a19; }
    }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
  </style>
  <rect class="bg" width="960" height="560" rx="16"/>
  <text class="ink" x="32" y="44" font-size="18" font-weight="600">Fewer total tokens than AKOR 0.8, same verified work</text>
  <text class="ink2" x="32" y="68" font-size="13">Input + billed output incl. hidden reasoning and CLI overhead · live claude -p · 3 to 5 calls per bar · every job oracle-checked</text>
    <line class="grid" x1="400" y1="92" x2="400" y2="510"/>
    <line class="grid" x1="500" y1="92" x2="500" y2="510"/>
    <line class="grid" x1="600" y1="92" x2="600" y2="510"/>
    <line class="grid" x1="700" y1="92" x2="700" y2="510"/>
    <line class="grid" x1="800" y1="92" x2="800" y2="510"/>
    <line class="axis" x1="300" y1="92" x2="300" y2="510"/>
    <text class="muted" x="300" y="530" text-anchor="middle">0%</text>
    <text class="muted" x="400" y="530" text-anchor="middle">10%</text>
    <text class="muted" x="500" y="530" text-anchor="middle">20%</text>
    <text class="muted" x="600" y="530" text-anchor="middle">30%</text>
    <text class="muted" x="700" y="530" text-anchor="middle">40%</text>
    <text class="muted" x="800" y="530" text-anchor="middle">50%</text>
  <line class="target" x1="650" y1="88" x2="650" y2="510"/>
  <text class="ink2" x="656" y="100" font-size="12">35% target</text>
  <g>
    <text class="ink" x="32" y="112" font-size="14" font-weight="600">64 jobs per call, uniform</text>
    <text class="ink2" x="48" y="139" font-size="13">Opus 5.5</text>
    <rect class="bar grow" x="300" y="125" width="470" height="20" rx="4" style="animation-delay:0.00s"/>
    <text class="ink val" x="778" y="140" font-size="13" font-weight="600">47%</text>
    <text class="ink2" x="48" y="169" font-size="13">Sonnet 5.5</text>
    <rect class="bar grow" x="300" y="155" width="470" height="20" rx="4" style="animation-delay:0.06s"/>
    <text class="ink val" x="778" y="170" font-size="13" font-weight="600">47%</text>
    <text class="ink2" x="48" y="199" font-size="13">Fable 5.1</text>
    <rect class="bar grow" x="300" y="185" width="450" height="20" rx="4" style="animation-delay:0.12s"/>
    <text class="ink val" x="758" y="200" font-size="13" font-weight="600">45%</text>
    <text class="ink2" x="48" y="229" font-size="13">Haiku 5.5</text>
    <rect class="bar grow" x="300" y="215" width="330" height="20" rx="4" style="animation-delay:0.18s"/>
    <text class="ink val" x="638" y="230" font-size="13" font-weight="600">33%</text>
    <text class="ink" x="32" y="270" font-size="14" font-weight="600">32 jobs per call, uniform</text>
    <text class="ink2" x="48" y="297" font-size="13">Opus 5.5</text>
    <rect class="bar grow" x="300" y="283" width="380" height="20" rx="4" style="animation-delay:0.24s"/>
    <text class="ink val" x="688" y="298" font-size="13" font-weight="600">38%</text>
    <text class="ink2" x="48" y="327" font-size="13">Sonnet 5.5</text>
    <rect class="bar grow" x="300" y="313" width="350" height="20" rx="4" style="animation-delay:0.30s"/>
    <text class="ink val" x="658" y="328" font-size="13" font-weight="600">35%</text>
    <text class="ink2" x="48" y="357" font-size="13">Fable 5.1</text>
    <rect class="bar grow" x="300" y="343" width="350" height="20" rx="4" style="animation-delay:0.36s"/>
    <text class="ink val" x="658" y="358" font-size="13" font-weight="600">35%</text>
    <text class="ink2" x="48" y="387" font-size="13">Haiku 5.5</text>
    <rect class="bar grow" x="300" y="373" width="320" height="20" rx="4" style="animation-delay:0.42s"/>
    <text class="ink val" x="628" y="388" font-size="13" font-weight="600">32%</text>
    <text class="ink" x="32" y="428" font-size="14" font-weight="600">64 jobs per call, mixed (3 domains, 10 operations)</text>
    <text class="ink2" x="48" y="455" font-size="13">Sonnet 5.5</text>
    <rect class="bar grow" x="300" y="441" width="280" height="20" rx="4" style="animation-delay:0.48s"/>
    <text class="ink val" x="588" y="456" font-size="13" font-weight="600">28%</text>
    <text class="ink2" x="48" y="485" font-size="13">Haiku 5.5</text>
    <rect class="bar grow" x="300" y="471" width="110" height="20" rx="4" style="animation-delay:0.54s"/>
    <text class="ink val" x="418" y="486" font-size="13" font-weight="600">11%</text>
  </g>
</svg>
