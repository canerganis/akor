  <rect class="grey grow" x="676" y="270" width="190.0" height="26" rx="6" style="animation-delay:1.00s"/>
  <text class="ink sans fade" x="876.0" y="290" font-size="18" font-weight="700" style="animation-delay:1.90s">23.4 s</text>
