<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">AKOR uses fewer tokens per verified job than plain JSON and answers faster, on three models</title>
  <desc id="d">Tokens per verified job, plain JSON versus AKOR: Sonnet 5.5 146.7 versus 87.0, 40.7 percent fewer; Opus 5.5 144.3 versus 82.6, 42.8 percent fewer; Fable 5.1 146.3 versus 86.9, 40.6 percent fewer. Median seconds per 64-job call: Sonnet 5.5 13.8 versus 12.5; Opus 5.5 17.9 versus 14.0; Fable 5.1 23.4 versus 18.7. Billed tokens include CLI overhead and hidden reasoning; failed calls are counted.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .panel { fill: #ffffff; stroke: #d9d8d3; stroke-width: 1.5; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .accent { fill: #2a78d6; }
    .accent-s { stroke: #2a78d6; }
    .grey { fill: #a6a59f; }
    .grey-s { stroke: #8a8984; }
    .track { fill: #ecebe6; }
    .rule { stroke: #e2e1dc; stroke-width: 1.5; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .gs { stop-color: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .panel { fill: #232322; stroke: #3a3a38; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .accent { fill: #3987e5; }
      .accent-s { stroke: #3987e5; }
      .grey { fill: #75746f; }
      .grey-s { stroke: #75746f; }
      .track { fill: #2b2b29; }
      .rule { stroke: #3a3a38; }
      .gs { stop-color: #3987e5; }
    }

    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .fade { animation: fade .5s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .badge { transform-box: fill-box; transform-origin: left center; animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .grow, .fade, .badge { animation: none; }
    }
  </style>

  <rect class="bg" width="960" height="420" rx="16"/>
  <path class="rule" d="M566 24 V 340"/>

  <text class="ink sans" x="170" y="40" font-size="19" font-weight="800">Tokens per verified job</text>
  <text class="ink sans" x="588" y="40" font-size="19" font-weight="800">Median seconds per 64-job call</text>
  <text class="ink sans" x="24" y="110" font-size="21" font-weight="800">Sonnet 5.5</text>
  <text class="ink2 sans" x="170" y="89" font-size="15" font-weight="400">Plain JSON</text>
  <rect class="track" x="258" y="70" width="220" height="26" rx="6"/>
  <rect class="grey grow" x="258" y="70" width="220.0" height="26" rx="6" style="animation-delay:0.10s"/>
  <text class="ink sans fade" x="488.0" y="90" font-size="18" font-weight="700" style="animation-delay:1.00s">146.7</text>
  <text class="ink sans" x="170" y="123" font-size="15" font-weight="700">AKOR</text>
  <rect class="track" x="258" y="104" width="220" height="26" rx="6"/>
