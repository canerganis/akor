  <rect class="accent grow" x="258" y="204" width="123.9" height="26" rx="6" style="animation-delay:0.65s"/>
  <text class="ink sans fade" x="391.9" y="224" font-size="18" font-weight="700" style="animation-delay:1.55s">82.6</text>
  <g class="badge" style="animation-delay:1.75s"><rect class="accent" x="455.9" y="205" width="82" height="24" rx="12"/><text class="sans" x="496.9" y="222" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">-42.8%</text></g>
  <text class="ink2 sans" x="588" y="189" font-size="15" font-weight="400">Plain JSON</text>
