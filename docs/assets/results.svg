<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">AKOR uses fewer tokens per verified job than plain JSON and answers faster</title>
  <desc id="d">Tokens per verified job, plain JSON versus AKOR: Sonnet 5.5 146.7 versus 87.0, 40.7 percent fewer; Opus 5.5 144.3 versus 82.6, 42.8 percent fewer. Median seconds per 64-job call: Sonnet 5.5 13.8 versus 12.5; Opus 5.5 17.9 versus 14.0. Billed tokens include CLI overhead and hidden reasoning; failed calls are counted.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .panel { fill: #ffffff; stroke: #d9d8d3; stroke-width: 1.5; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .accent { fill: #2a78d6; }
    .accent-s { stroke: #2a78d6; }
    .grey { fill: #a6a59f; }
    .grey-s { stroke: #8a8984; }
    .track { fill: #ecebe6; }
    .rule { stroke: #e2e1dc; stroke-width: 1.5; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .gs { stop-color: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .panel { fill: #232322; stroke: #3a3a38; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .accent { fill: #3987e5; }
      .accent-s { stroke: #3987e5; }
      .grey { fill: #75746f; }
      .grey-s { stroke: #75746f; }
      .track { fill: #2b2b29; }
      .rule { stroke: #3a3a38; }
      .gs { stop-color: #3987e5; }
    }

    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .fade { animation: fade .5s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .badge { transform-box: fill-box; transform-origin: left center; animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .grow, .fade, .badge { animation: none; }
    }
  </style>

  <rect class="bg" width="960" height="360" rx="16"/>
  <path class="rule" d="M480 28 V 274"/>

  <text class="ink sans" x="24" y="44" font-size="26" font-weight="800">Sonnet 5.5</text>
  <text class="ink2 sans" x="24" y="82" font-size="16">Tokens per verified job</text>
  <text class="ink2 sans" x="456" y="82" font-size="14" text-anchor="end">same 64 jobs, one call</text>
  <text class="ink2 sans" x="24" y="113" font-size="15" font-weight="400">Plain JSON</text>
  <rect class="track" x="112" y="94" width="250" height="26" rx="6"/>
  <rect class="grey grow" x="112" y="94" width="250.0" height="26" rx="6" style="animation-delay:0.10s"/>
  <text class="ink sans fade" x="372.0" y="114" font-size="18" font-weight="700" style="animation-delay:1.00s">146.7</text>
  <text class="ink sans" x="24" y="147" font-size="15" font-weight="700">AKOR</text>
  <rect class="track" x="112" y="128" width="250" height="26" rx="6"/>
  <rect class="accent grow" x="112" y="128" width="148.3" height="26" rx="6" style="animation-delay:0.25s"/>
  <text class="ink sans fade" x="270.3" y="148" font-size="18" font-weight="700" style="animation-delay:1.15s">87.0</text>
  <g class="badge" style="animation-delay:1.35s"><rect class="accent" x="334.3" y="129" width="82" height="24" rx="12"/><text class="sans" x="375.3" y="146" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">-40.7%</text></g>
  <text class="ink2 sans" x="24" y="196" font-size="16">Median seconds per 64-job call</text>
  <text class="ink2 sans" x="24" y="227" font-size="15" font-weight="400">Plain JSON</text>
  <rect class="track" x="112" y="208" width="250" height="26" rx="6"/>
  <rect class="grey grow" x="112" y="208" width="192.7" height="26" rx="6" style="animation-delay:0.60s"/>
  <text class="ink sans fade" x="314.7" y="228" font-size="18" font-weight="700" style="animation-delay:1.50s">13.8 s</text>
  <text class="ink sans" x="24" y="261" font-size="15" font-weight="700">AKOR</text>
  <rect class="track" x="112" y="242" width="250" height="26" rx="6"/>
  <rect class="accent grow" x="112" y="242" width="174.6" height="26" rx="6" style="animation-delay:0.75s"/>
  <text class="ink sans fade" x="296.6" y="262" font-size="18" font-weight="700" style="animation-delay:1.65s">12.5 s</text>
  <text class="ink sans" x="492" y="44" font-size="26" font-weight="800">Opus 5.5</text>
  <text class="ink2 sans" x="492" y="82" font-size="16">Tokens per verified job</text>
  <text class="ink2 sans" x="924" y="82" font-size="14" text-anchor="end">same 64 jobs, one call</text>
  <text class="ink2 sans" x="492" y="113" font-size="15" font-weight="400">Plain JSON</text>
  <rect class="track" x="580" y="94" width="250" height="26" rx="6"/>
  <rect class="grey grow" x="580" y="94" width="245.9" height="26" rx="6" style="animation-delay:0.10s"/>
  <text class="ink sans fade" x="835.9" y="114" font-size="18" font-weight="700" style="animation-delay:1.00s">144.3</text>
  <text class="ink sans" x="492" y="147" font-size="15" font-weight="700">AKOR</text>
  <rect class="track" x="580" y="128" width="250" height="26" rx="6"/>
  <rect class="accent grow" x="580" y="128" width="140.8" height="26" rx="6" style="animation-delay:0.25s"/>
  <text class="ink sans fade" x="730.8" y="148" font-size="18" font-weight="700" style="animation-delay:1.15s">82.6</text>
  <g class="badge" style="animation-delay:1.35s"><rect class="accent" x="794.8" y="129" width="82" height="24" rx="12"/><text class="sans" x="835.8" y="146" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">-42.8%</text></g>
  <text class="ink2 sans" x="492" y="196" font-size="16">Median seconds per 64-job call</text>
  <text class="ink2 sans" x="492" y="227" font-size="15" font-weight="400">Plain JSON</text>
  <rect class="track" x="580" y="208" width="250" height="26" rx="6"/>
  <rect class="grey grow" x="580" y="208" width="250.0" height="26" rx="6" style="animation-delay:0.60s"/>
  <text class="ink sans fade" x="840.0" y="228" font-size="18" font-weight="700" style="animation-delay:1.50s">17.9 s</text>
  <text class="ink sans" x="492" y="261" font-size="15" font-weight="700">AKOR</text>
  <rect class="track" x="580" y="242" width="250" height="26" rx="6"/>
  <rect class="accent grow" x="580" y="242" width="195.5" height="26" rx="6" style="animation-delay:0.75s"/>
  <text class="ink sans fade" x="785.5" y="262" font-size="18" font-weight="700" style="animation-delay:1.65s">14.0 s</text>

  <path class="rule" d="M24 296 H 936"/>
  <text class="ink2 sans" x="24" y="328" font-size="16">Billed tokens incl. CLI overhead and hidden reasoning; failed calls counted. 64 jobs per call.</text>
</svg>
