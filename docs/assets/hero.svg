<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">22 times fewer tokens than one call per job</title>
  <desc id="d">The same 64 jobs on Claude Sonnet 5.5: one plain JSON call per job costs 2,052 tokens per requested job, one AKOR call costs 91.6, 22 times fewer. On four Claude models the gap is 20 to 27 times. Most of the gap is batching.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .panel { fill: #ffffff; stroke: #d9d8d3; stroke-width: 1.5; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .accent { fill: #2a78d6; }
    .accent-s { stroke: #2a78d6; }
    .grey { fill: #a6a59f; }
    .grey-s { stroke: #8a8984; }
    .track { fill: #ecebe6; }
    .rule { stroke: #e2e1dc; stroke-width: 1.5; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .gs { stop-color: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .panel { fill: #232322; stroke: #3a3a38; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .accent { fill: #3987e5; }
      .accent-s { stroke: #3987e5; }
      .grey { fill: #75746f; }
      .grey-s { stroke: #75746f; }
      .track { fill: #2b2b29; }
      .rule { stroke: #3a3a38; }
      .gs { stop-color: #3987e5; }
    }

    .step { opacity: 0; }
    .s0 { animation: blip 0.15s linear 0.25s forwards; }
    .s1 { animation: blip 0.15s linear 0.4s forwards; }
    .s2 { animation: blip 0.15s linear 0.55s forwards; }
    .s3 { animation: blip 0.15s linear 0.7s forwards; }
    .s4 { animation: blip 0.20s linear 0.85s forwards; }
    .s5 { animation: blip 0.25s linear 1.05s forwards; }
    .s6 { animation: blip 0.30s linear 1.3s forwards; }
    .s7 { animation: blip 0.35s linear 1.6s forwards; }
    .s8 { animation: hold .25s ease-out 1.95s forwards; }
    @keyframes blip { 0% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes hold { from { opacity: 0; } to { opacity: 1; } }
    .fx { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: center bottom; opacity: .55; animation: barup .6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes barup { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .glow { animation: pulse 5s ease-in-out 2.4s infinite; }
    @keyframes pulse { 0%, 100% { opacity: .9; } 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) {
      .step { opacity: 0; animation: none; }
      .step.last { opacity: 1; }
      .fx, .bar, .glow { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop class="gs" offset="0" stop-opacity="0.22"/>
      <stop class="gs" offset="1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="bg" width="960" height="300" rx="16"/>
  <ellipse class="glow" cx="230" cy="120" rx="300" ry="130" fill="url(#g)"/>

  <text class="accent sans step s0" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">1×</text>
  <text class="accent sans step s1" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">2×</text>
  <text class="accent sans step s2" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">4×</text>
  <text class="accent sans step s3" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">8×</text>
  <text class="accent sans step s4" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">12×</text>
  <text class="accent sans step s5" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">16×</text>
  <text class="accent sans step s6" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">19×</text>
  <text class="accent sans step s7" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">21×</text>
  <text class="accent sans step last s8" x="40" y="176" font-size="150" font-weight="800" letter-spacing="-4">22×</text>

  <g class="sans">
    <text class="ink fx" x="360" y="108" font-size="40" font-weight="800" style="animation-delay:.9s">fewer tokens per job</text>
    <text class="ink2 fx" x="360" y="148" font-size="26" style="animation-delay:1.15s">than one call per job, per requested job.</text>
    <text class="ink2 fx" x="360" y="182" font-size="26" style="animation-delay:1.3s">20× to 27× on four Claude models.</text>
  </g>

  <g class="sans">
    <rect class="grey bar" x="48" y="200" width="864" height="20" rx="4" style="animation-delay:1.0s"/>
    <text class="ink fx" x="60" y="215" font-size="14" font-weight="600" style="animation-delay:1.4s">64 calls, one per job: 2,052 tokens per requested job</text>
    <rect class="accent bar" x="48" y="228" width="39" height="20" rx="4" style="opacity:1;animation-delay:1.6s"/>
    <text class="ink fx" x="97" y="243" font-size="14" font-weight="600" style="animation-delay:1.8s">1 AKOR call: 91.6</text>
  </g>
  <text class="ink2 sans fx" x="48" y="278" font-size="19" style="animation-delay:1.8s">Claude Sonnet 5.5 shown, 64 jobs, 3 seeds, preregistered. Most of the gap is batching.</text>
</svg>
