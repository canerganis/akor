[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akor-protocol"
version = "0.1.0"
description = "Compact, provider-neutral agent communication protocol and reference relay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
akor = "akor:main"

[tool.setuptools]
py-modules = ["akor"]
