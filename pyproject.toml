[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akor-protocol"
version = "0.9.0"
description = "Compact, provider-neutral agent communication protocol and reference relay"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
benchmark = ["tiktoken==0.14.0"]

[project.scripts]
akor = "akor:main"
oz = "oz_cli:main"

[tool.setuptools]
py-modules = ["akor", "oz", "oz_batch", "oz_runtime", "oz_cli", "oz_worker", "oz_workspace", "oz_reply", "oz_do", "oz_accept", "oz_runner", "oz_memo", "oz_quota", "oz_flow", "oz_fault"]
